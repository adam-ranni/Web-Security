name: waf-gateway

services:
  bunkerweb:
    image: bunkerity/bunkerweb-all-in-one:1.6.17
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:7000:7000"
    volumes:
      - bunkerweb-data:/data
    networks:
      - backend

volumes:
  bunkerweb-data:

networks:
  backend:
    name: waf-lab-backend